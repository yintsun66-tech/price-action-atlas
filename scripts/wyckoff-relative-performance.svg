<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="t d">
<title id="t">相對較強，仍可能正在下跌</title><desc id="d">非真實行情。兩條原創合成序列都由一百開始：標的 A 經九十九跌至九十八，基準經九十七跌至九十五。A 跌百分之二，基準跌百分之五，報酬差三個百分點；價格比率由一增至九十八除九十五，百分比變動約三點一六。相對強弱不是絕對獲利。</desc>
<rect width="960" height="640" rx="24" fill="#f5f7fa"/>
<g font-family="system-ui,'Microsoft JhengHei',sans-serif" fill="#20262d">
<text x="40" y="52" font-size="31" font-weight="750">相對較強，仍可能正在下跌</text>
<text x="40" y="88" font-size="18" fill="#53616e">本站原創合成序列・共同起點 100・非真實行情或績效</text>
<rect x="40" y="119" width="520" height="305" rx="16" fill="#fff" stroke="#d5dde6"/>
<path d="M100 180H520M100 250H520M100 355H520" stroke="#e1e7ed"/>
<g font-size="17" fill="#53616e"><text x="56" y="186">100</text><text x="64" y="256">98</text><text x="64" y="361">95</text><text x="100" y="399">起點</text><text x="292" y="399">中途</text><text x="475" y="399">終點</text></g>
<path d="M120 180L300 215L480 250" fill="none" stroke="#23658d" stroke-width="4"/>
<path d="M120 180L300 285L480 355" fill="none" stroke="#a36543" stroke-width="4"/>
<g fill="#23658d"><circle cx="120" cy="180" r="5"/><circle cx="300" cy="215" r="5"/><circle cx="480" cy="250" r="5"/></g>
<g fill="#a36543"><circle cx="300" cy="285" r="5"/><circle cx="480" cy="355" r="5"/></g>
<text x="315" y="199" font-size="19" fill="#23658d" font-weight="700">A：100 → 99 → 98</text>
<text x="280" y="337" font-size="19" fill="#955b3c" font-weight="700">基準：100 → 97 → 95</text>
<rect x="587" y="119" width="333" height="305" rx="16" fill="#eaf1f7"/>
<text x="610" y="159" font-size="21" font-weight="750">各自的漲跌仍要看</text>
<text x="610" y="211" font-size="29" font-weight="750">A：−2%</text><text x="610" y="257" font-size="29" font-weight="750">基準：−5%</text>
<text x="610" y="315" font-size="21">報酬差：</text><text x="610" y="358" font-size="29" font-weight="750">＋3 個百分點</text>
<rect x="40" y="450" width="880" height="115" rx="16" fill="#fff4e2"/>
<text x="62" y="486" font-size="22" font-weight="750">比率的百分比變動要另外算</text>
<text x="62" y="531" font-size="26">(98 ÷ 95) ÷ (100 ÷ 100) − 1 ≈ ＋3.16%</text>
<text x="40" y="611" font-size="21" font-weight="750">相對表現不等於絕對獲利；比率變動不等於百分點差。</text>
</g></svg>
