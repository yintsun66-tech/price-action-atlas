<svg xmlns="http://www.w3.org/2000/svg" width="960" height="579" viewBox="0 0 960 579" role="img" aria-labelledby="t d"><title id="t">可負擔風險，比想下幾口先決</title><desc id="d">本站自編數字與分類 · 非市場實測。本站原創合成教學圖；不是即時行情、原作者圖表或績效證據。</desc><rect width="960" height="579" rx="22" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,'Microsoft JhengHei',sans-serif"><text x="40" y="49" fill="#1d1d1f" font-size="28" font-weight="760" text-anchor="start">可負擔風險，比想下幾口先決</text><text x="40" y="85" fill="#586272" font-size="21" font-weight="450" text-anchor="start">本站自編數字與分類 · 非市場實測</text><rect x="40" y="122" width="293.3333333333333" height="72" fill="#f1f6fc"/><text x="56" y="151" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">欄位</text><rect x="333.3333333333333" y="122" width="293.3333333333333" height="72" fill="#f1f6fc"/><text x="349.3333333333333" y="151" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">自編值</text><rect x="626.6666666666666" y="122" width="293.3333333333333" height="72" fill="#f1f6fc"/><text x="642.6666666666666" y="151" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">意義</text><rect x="40" y="194" width="293.3333333333333" height="86" fill="#fff" stroke="#dce3ed"/><text x="56" y="225" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">進場／失效</text><rect x="333.3333333333333" y="194" width="293.3333333333333" height="86" fill="#fff" stroke="#dce3ed"/><text x="349.3333333333333" y="225" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">24,000／23,95</text><text x="349.3333333333333" y="257" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">0</text><rect x="626.6666666666666" y="194" width="293.3333333333333" height="86" fill="#fff" stroke="#dce3ed"/><text x="642.6666666666666" y="225" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">價格風險50點</text><rect x="40" y="280" width="293.3333333333333" height="86" fill="#f8f9fb" stroke="#dce3ed"/><text x="56" y="311" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">一口計畫風險</text><rect x="333.3333333333333" y="280" width="293.3333333333333" height="86" fill="#f8f9fb" stroke="#dce3ed"/><text x="349.3333333333333" y="311" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">50×10＋100＝60</text><text x="349.3333333333333" y="343" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">0元</text><rect x="626.6666666666666" y="280" width="293.3333333333333" height="86" fill="#f8f9fb" stroke="#dce3ed"/><text x="642.6666666666666" y="311" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">成本100是例題假設</text><rect x="40" y="366" width="293.3333333333333" height="86" fill="#fff" stroke="#dce3ed"/><text x="56" y="397" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">帳戶預算</text><rect x="333.3333333333333" y="366" width="293.3333333333333" height="86" fill="#fff" stroke="#dce3ed"/><text x="349.3333333333333" y="397" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">100,000×0.25</text><text x="349.3333333333333" y="429" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">%＝250元</text><rect x="626.6666666666666" y="366" width="293.3333333333333" height="86" fill="#fff" stroke="#dce3ed"/><text x="642.6666666666666" y="397" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">整數口數為零，略過</text><text x="40" y="472" fill="#586272" font-size="21" font-weight="450" text-anchor="start">風險預算不夠，不把結構停損硬縮成可下單的距離。</text><path d="M40 531H920" stroke="#dce3ed"/><text x="40" y="559" fill="#586272" font-size="19" font-weight="450" text-anchor="start">原創合成示意 · 非真實行情／交易訊號 · 價格、量與事件均須另行驗證</text></g></svg>