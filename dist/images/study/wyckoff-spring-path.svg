10；最低98、收102才有返回事件。</text><text x="40" y="512" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">後面111、110、115是另外給定的後續，不能提前知道。</text><text x="40" y="546" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">Spring／UTAD非必備；此圖沒有真實量能或機構身份。</text><path d="M40 592H920" stroke="#dce3ed"/><text x="40" y="620" fill="#586272" font-size="19" font-weight="450" text-anchor="start">原創合成示意 · 非真實行情／交易訊號 · 價格、量與事件均須另行驗證</text></g></svg>