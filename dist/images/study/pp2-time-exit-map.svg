<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img" aria-labelledby="t d"><title id="t">六根完整棒，到期與成交分開</title><desc id="d">本站原創整理 · 每格是一個可核對的問題。本站原創合成教學圖；不是即時行情、原作者圖表或績效證據。</desc><rect width="960" height="530" rx="22" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,'Microsoft JhengHei',sans-serif"><text x="40" y="49" fill="#1d1d1f" font-size="28" font-weight="760" text-anchor="start">六根完整棒，到期與成交分開</text><text x="40" y="85" fill="#586272" font-size="21" font-weight="450" text-anchor="start">本站原創整理 · 每格是一個可核對的問題</text><rect x="40" y="118" width="420" height="135" rx="16" fill="#f1f6fc" stroke="#dce3ed"/><text x="62" y="155" fill="#1d1d1f" font-size="24" font-weight="730" text-anchor="start">01  10:00 進場例</text><text x="62" y="196" fill="#586272" font-size="21" font-weight="450" text-anchor="start">第一根於10:10完成</text><rect x="500" y="118" width="420" height="135" rx="16" fill="#f4f7f8" stroke="#dce3ed"/><text x="522" y="155" fill="#1d1d1f" font-size="24" font-weight="730" text-anchor="start">02  11:00</text><text x="522" y="196" fill="#586272" font-size="21" font-weight="450" text-anchor="start">第六根完成，產生到期</text><rect x="40" y="278" width="420" height="135" rx="16" fill="#f1f6fc" stroke="#dce3ed"/><text x="62" y="315" fill="#1d1d1f" font-size="24" font-weight="730" text-anchor="start">03  下一可用價格</text><text x="62" y="356" fill="#586272" font-size="21" font-weight="450" text-anchor="start">收100.4不保證成交100.4</text><rect x="500" y="278" width="420" height="135" rx="16" fill="#f4f7f8" stroke="#dce3ed"/><text x="522" y="315" fill="#1d1d1f" font-size="24" font-weight="730" text-anchor="start">04  若成交99.8</text><text x="522" y="356" fill="#586272" font-size="21" font-weight="450" text-anchor="start">從100進場毛損0.2，再扣費</text><text x="40" y="454" fill="#586272" font-size="21" font-weight="450" text-anchor="start">每次更新都保存當時資料，不以後來結果回填原判斷。</text><path d="M40 482H920" stroke="#dce3ed"/><text x="40" y="510" fill="#586272" font-size="19" font-weight="450" text-anchor="start">原創合成示意 · 非真實行情／交易訊號 · 價格、量與事件均須另行驗證</text></g></svg>