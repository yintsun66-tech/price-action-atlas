<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="t d"><title id="t">強棒外觀與下一棒風險分開</title><desc id="d">正文例：開100、高110、低99、收109。本站原創合成教學圖；不是即時行情、原作者圖表或績效證據。</desc><rect width="960" height="650" rx="22" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,'Microsoft JhengHei',sans-serif"><text x="40" y="49" fill="#1d1d1f" font-size="28" font-weight="760" text-anchor="start">強棒外觀與下一棒風險分開</text><text x="40" y="85" fill="#586272" font-size="21" font-weight="450" text-anchor="start">正文例：開100、高110、低99、收109</text><path d="M90 410H860" stroke="#dce3ed"/><text x="78" y="417" fill="#586272" font-size="20" font-weight="450" text-anchor="end">98</text><path d="M90 323.3333333333334H860" stroke="#dce3ed"/><text x="78" y="330.3333333333334" fill="#586272" font-size="20" font-weight="450" text-anchor="end">102.3</text><path d="M90 236.66666666666657H860" stroke="#dce3ed"/><text x="78" y="243.66666666666657" fill="#586272" font-size="20" font-weight="450" text-anchor="end">106.7</text><path d="M90 150H860" stroke="#dce3ed"/><text x="78" y="157" fill="#586272" font-size="20" font-weight="450" text-anchor="end">111</text><path d="M475 170V390" stroke="#176bb9" stroke-width="3"/><rect x="455" y="190" width="40" height="180" fill="#e4f0fe" stroke="#176bb9" stroke-width="2"/><text x="475" y="441" fill="#586272" font-size="22" font-weight="450" text-anchor="middle">1</text><text x="40" y="468" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">實體 9／振幅 11＝81.8%；不是勝率。</text><text x="40" y="502" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">原參考進場 109、停損 98；下一可用價若變113，風險變15。</text><text x="40" y="536" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">固定結構目標131，報酬風險比變為18／15＝1.2。</text><path d="M40 602H920" stroke="#dce3ed"/><text x="40" y="630" fill="#586272" font-size="19" font-weight="450" text-anchor="start">原創合成示意 · 非真實行情／交易訊號 · 價格、量與事件均須另行驗證</text></g></svg>