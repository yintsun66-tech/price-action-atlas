<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="t d"><title id="t">單棒外觀可以量測，路徑仍未知</title><desc id="d">本圖另設教學 OHLC：100／110／98／108。本站原創合成教學圖；不是即時行情、原作者圖表或績效證據。</desc><rect width="960" height="650" rx="22" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,'Microsoft JhengHei',sans-serif"><text x="40" y="49" fill="#1d1d1f" font-size="28" font-weight="760" text-anchor="start">單棒外觀可以量測，路徑仍未知</text><text x="40" y="85" fill="#586272" font-size="21" font-weight="450" text-anchor="start">本圖另設教學 OHLC：100／110／98／108</text><path d="M90 410H860" stroke="#dce3ed"/><text x="78" y="417" fill="#586272" font-size="20" font-weight="450" text-anchor="end">97</text><path d="M90 323.33333333333326H860" stroke="#dce3ed"/><text x="78" y="330.33333333333326" fill="#586272" font-size="20" font-weight="450" text-anchor="end">101.7</text><path d="M90 236.66666666666674H860" stroke="#dce3ed"/><text x="78" y="243.66666666666674" fill="#586272" font-size="20" font-weight="450" text-anchor="end">106.3</text><path d="M90 150H860" stroke="#dce3ed"/><text x="78" y="157" fill="#586272" font-size="20" font-weight="450" text-anchor="end">111</text><path d="M475 168.57142857142856V391.42857142857144" stroke="#176bb9" stroke-width="3"/><rect x="455" y="205.71428571428572" width="40" height="148.57142857142856" fill="#e4f0fe" stroke="#176bb9" stroke-width="2"/><text x="475" y="441" fill="#586272" font-size="22" font-weight="450" text-anchor="middle">1</text><text x="40" y="468" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">實體由100到108，影線顯示最高110、最低98。</text><text x="40" y="502" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">僅這四個數字，無法知道先到110或先到98。</text><text x="40" y="536" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">同樣的棒形還需放回趨勢、區間與所在位置。</text><path d="M40 602H920" stroke="#dce3ed"/><text x="40" y="630" fill="#586272" font-size="19" font-weight="450" text-anchor="sta