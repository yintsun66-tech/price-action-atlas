<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img" aria-labelledby="t d"><title id="t">名詞、規則與證據，是三個工作</title><desc id="d">本站原創整理 · 每格是一個可核對的問題。本站原創合成教學圖；不是即時行情、原作者圖表或績效證據。</desc><rect width="960" height="530" rx="22" fill="#fff"/><metadata>Original Price Action Atlas diagram. CC BY-SA 4.0: https://creativecommons.org/licenses/by-sa/4.0/ . Not copied from the source textbook image.</metadata><g font-family="-apple-system,BlinkMacSystemFont,'Microsoft JhengHei',sans-serif"><text x="40" y="49" fill="#1d1d1f" font-size="28" font-weight="760" text-anchor="start">名詞、規則與證據，是三個工作</text><text x="40" y="85" fill="#586272" font-size="21" font-weight="450" text-anchor="start">本站原創整理 · 每格是一個可核對的問題</text><rect x="40" y="118" width="420" height="135" rx="16" fill="#f1f6fc" stroke="#dce3ed"/><text x="62" y="155" fill="#1d1d1f" font-size="24" font-weight="730" text-anchor="start">01  教材名詞</text><text x="62" y="196" fill="#586272" font-size="21" font-weight="450" text-anchor="start">原文表格是一種分類</text><rect x="500" y="118" width="420" height="135" rx="16" fill="#f4f7f8" stroke="#dce3ed"/><text x="522" y="155" fill="#1d1d1f" font-size="24" font-weight="730" text-anchor="start">02  自訂規則</text><text x="522" y="196" fill="#586272" font-size="21" font-weight="450" text-anchor="start">固定當時可計算條件</text><rect x="40" y="278" width="420" height="135" rx="16" fill="#f1f6fc" stroke="#dce3ed"/><text x="62" y="315" fill="#1d1d1f" font-size="24" font-weight="730" text-anchor="start">03  研究證據</text><text x="62" y="356" fill="#586272" font-size="21" font-weight="450" text-anchor="start">另測成本、風險與新資料</text><rect x="500" y="278" width="420" height="135" rx="16" fill="#f4f7f8" stroke="#dce3ed"/><text x="522" y="315" fill="#1d1d1f" font-size="24" font-weight="730" text-anchor="start">04  保留界線</text><text x="522" y="356" fill="#586272" font-size="21" font-weight="450" text-anchor="start">授權可重用不表示會獲利</text><text x="40" y="454" fill="#586272" font-size="21" font-weight="450" text-anchor="start">每次更新都保存當時資料，不以後來結果回填原判斷。</text><path d="M40 482H920" stroke="#dce3ed"/><text x="40" y="510" fill="#586272" font-size="19" font-weight="450" text-anchor="start">原創合成示意 · 非真實行情／交易訊號 · 價格、量與事件均須另行驗證</text></g></svg>