<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="t d"><title id="t">同樣70%，區間不一樣寬</title><desc id="d">本站虛構計數 · 獨立同分布二元近似 · 雙側95% Wilson。本站原創合成教學圖；不是即時行情、原作者圖表或績效證據。</desc><rect width="960" height="640" rx="22" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,'Microsoft JhengHei',sans-serif"><text x="40" y="49" fill="#1d1d1f" font-size="28" font-weight="760" text-anchor="start">同樣70%，區間不一樣寬</text><text x="40" y="85" fill="#586272" font-size="21" font-weight="450" text-anchor="start">本站虛構計數 · 獨立同分布二元近似 · 雙側95% Wilson</text><path d="M210 155V365" stroke="#dce3ed"/><text x="210" y="402" fill="#586272" font-size="20" font-weight="450" text-anchor="middle">0%</text><path d="M340 155V365" stroke="#dce3ed"/><text x="340" y="402" fill="#586272" font-size="20" font-weight="450" text-anchor="middle">20%</text><path d="M470 155V365" stroke="#dce3ed"/><text x="470" y="402" fill="#586272" font-size="20" font-weight="450" text-anchor="middle">40%</text><path d="M600 155V365" stroke="#dce3ed"/><text x="600" y="402" fill="#586272" font-size="20" font-weight="450" text-anchor="middle">60%</text><path d="M730 155V365" stroke="#dce3ed"/><text x="730" y="402" fill="#586272" font-size="20" font-weight="450" text-anchor="middle">80%</text><path d="M860 155V365" stroke="#dce3ed"/><text x="860" y="402" fill="#586272" font-size="20" font-weight="450" text-anchor="middle">100%</text><text x="40" y="196" fill="#1d1d1f" font-size="24" font-weight="700" text-anchor="start">14／20</text><text x="40" y="229" fill="#586272" font-size="20" font-weight="450" text-anchor="start">觀察70%</text><path d="M522.6676680730709 205H765.4397908346324" stroke="#176bb9" stroke-width="7"/><path d="M522.6676680730709 193V217M765.4397908346324 193V217" stroke="#176bb9" stroke-width="3"/><circle cx="665" cy="205" r="8" fill="#176bb9"/><text x="644.0537294538517" y="182" fill="#176bb9" font-size="22" font-weight="700" text-anchor="middle">48.1%–85.5%</text><text x="40" y="326" fill="#1d1d1f" font-size="24" font-weight="700" text-anchor="start">140／200</text><text x="40" y="359" fill="#586272" font-size="20" font-weight="450" text-anchor="start">觀察70%</text><path d="M621.5860555782473 335H703.5141595638597" stroke="#28766d" stroke-width="7"/><path d="M621.5860555782473 323V347M703.5141595638597 323V347" stroke="#28766d" stroke-width="3"/><circle cx="665" cy="335" r="8" fill="#28766d"/><text x="662.5501075710536" y="312" fill="#28766d" font-size="22" font-weight="700" text-anchor="middle">63.3%–75.9%</text><text x="40" y="460" fill="#1d1d1f" font-size="23" font-weight="450" text-anchor="start">第一組寬約37.3百分點；第二組寬約12.6百分點。</text><text x="40" y="502" fill="#586272" font-size="22" font-weight="450" text-anchor="start">圓點是觀察比例，不是區間中點；不是下一筆勝率保證。</text><text x="40" y="544" fill="#586272" font-size="22" font-weight="450" text-anchor="start">同一成本假設仍為 −0.05R；比例區間不等於淨收益區間。</text><path d="M40 592H920" stroke="#dce3ed"/><text x="40" y="620" fill="#586272" font-size="19" font-weight="450" text-anchor="start">原創合成示意 · 非真實行情／交易訊號 · 價格、量與事件均須另行驗證</text></g></svg>