<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="t d"><title id="t">反轉證據逐步增加，仍需檢查空間</title><desc id="d">本站合成價格路徑 · 先標已知事件，再讀後續結果。本站原創合成教學圖；不是即時行情、原作者圖表或績效證據。</desc><rect width="960" height="640" rx="22" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,'Microsoft JhengHei',sans-serif"><text x="40" y="49" fill="#1d1d1f" font-size="28" font-weight="760" text-anchor="start">反轉證據逐步增加，仍需檢查空間</text><text x="40" y="85" fill="#586272" font-size="21" font-weight="450" text-anchor="start">本站合成價格路徑 · 先標已知事件，再讀後續結果</text><path d="M85 395H875" stroke="#dce3ed"/><text x="73" y="402" fill="#586272" font-size="20" font-weight="450" text-anchor="end">24,898</text><path d="M85 313.3333333333333H875" stroke="#dce3ed"/><text x="73" y="320.3333333333333" fill="#586272" font-size="20" font-weight="450" text-anchor="end">24,966</text><path d="M85 231.66666666666666H875" stroke="#dce3ed"/><text x="73" y="238.66666666666666" fill="#586272" font-size="20" font-weight="450" text-anchor="end">25,034</text><path d="M85 150H875" stroke="#dce3ed"/><text x="73" y="157" fill="#586272" font-size="20" font-weight="450" text-anchor="end">25,102</text><path d="M85 200.44117647058823H875" stroke="#9b671d" stroke-dasharray="7 6" stroke-width="2"/><text x="875" y="191.44117647058823" fill="#9b671d" font-size="20" font-weight="450" text-anchor="end">原已知回檔低點 25,060</text><path d="M85 392.5980392156863 L243 152.40196078431373 L401 182.4264705882353 L559 218.45588235294116 L717 176.421568627451 L875 248.48039215686276" fill="none" stroke="#176bb9" stroke-width="4.5" stroke-linejoin="round"/><circle cx="85" cy="392.5980392156863" r="4" fill="#176bb9"/><text x="85" y="426" fill="#586272" font-size="20" font-weight="450" text-anchor="middle">1</text><circle cx="243" cy="152.40196078431373" r="4" fill="#176bb9"/><text x="243" y="426" fill="#586272" font-size="20" font-weight="450" text-anchor="middle">2</text><circle cx="401" cy="182.42