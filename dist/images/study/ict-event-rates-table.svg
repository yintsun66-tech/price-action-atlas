<svg xmlns="http://www.w3.org/2000/svg" width="960" height="665" viewBox="0 0 960 665" role="img" aria-labelledby="t d"><title id="t">同一份虛構清單，不同問題與分母</title><desc id="d">本站自編數字與分類 · 非市場實測。本站原創合成教學圖；不是即時行情、原作者圖表或績效證據。</desc><rect width="960" height="665" rx="22" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,'Microsoft JhengHei',sans-serif"><text x="40" y="49" fill="#1d1d1f" font-size="28" font-weight="760" text-anchor="start">同一份虛構清單，不同問題與分母</text><text x="40" y="85" fill="#586272" font-size="21" font-weight="450" text-anchor="start">本站自編數字與分類 · 非市場實測</text><rect x="40" y="122" width="293.3333333333333" height="72" fill="#f1f6fc"/><text x="56" y="151" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">問題</text><rect x="333.3333333333333" y="122" width="293.3333333333333" height="72" fill="#f1f6fc"/><text x="349.3333333333333" y="151" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">計數／分母</text><rect x="626.6666666666666" y="122" width="293.3333333333333" height="72" fill="#f1f6fc"/><text x="642.6666666666666" y="151" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">事件比例</text><rect x="40" y="194" width="293.3333333333333" height="86" fill="#fff" stroke="#dce3ed"/><text x="56" y="225" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">全體中曾觸及</text><rect x="333.3333333333333" y="194" width="293.3333333333333" height="86" fill="#fff" stroke="#dce3ed"/><text x="349.3333333333333" y="225" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">6／10</text><rect x="626.6666666666666" y="194" width="293.3333333333333" height="86" fill="#fff" stroke="#dce3ed"/><text x="642.6666666666666" y="225" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">60%</text><rect x="40" y="280" width="293.3333333333333" height="86" fill="#f8f9fb" stroke="#dce3ed"/><text x="56" y="311" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">全體中到中線</text><rect x="333.3333333333333" y="280" width="293.3333333333333" height="86" fill="#f8f9fb" stroke="#dce3ed"/><text x="349.3333333333333" y="311" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">4／10</text><rect x="626.6666666666666" y="280" width="293.3333333333333" height="86" fill="#f8f9fb" stroke="#dce3ed"/><text x="642.6666666666666" y="311" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">40%</text><rect x="40" y="366" width="293.3333333333333" height="86" fill="#fff" stroke="#dce3ed"/><text x="56" y="397" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">全體中完整回補</text><rect x="333.3333333333333" y="366" width="293.3333333333333" height="86" fill="#fff" stroke="#dce3ed"/><text x="349.3333333333333" y="397" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">3／10</text><rect x="626.6666666666666" y="366" width="293.3333333333333" height="86" fill="#fff" stroke="#dce3ed"/><text x="642.6666666666666" y="397" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">30%</text><rect x="40" y="452" width="293.3333333333333" height="86" fill="#f8f9fb" stroke="#dce3ed"/><text x="56" y="483" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">已觸及中完整回補</text><rect x="333.3333333333333" y="452" width="293.3333333333333" height="86" fill="#f8f9fb" stroke="#dce3ed"/><text x="349.3333333333333" y="483" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">3／6</text><rect x="626.6666666666666" y="452" width="293.3333333333333" height="86" fill="#f8f9fb" stroke="#dce3ed"/><text x="642.6666666666666" y="483" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">50%</text><text x="40" y="558" fill="#586272" font-size="21" font-weight="450" text-anchor="start">全部完成相同十根觀察窗；沒有指定交易、成本，以上均不是交易勝率。</text><path d="M40 617H920" stroke="#dce3ed"/><text x="40" y="645" fill="#586272" font-size="19" font-weight="450" text-anchor="start">原創合成示意 · 非真實行情／交易訊號 · 價格、量與事件均須另行驗證</text></g></svg>