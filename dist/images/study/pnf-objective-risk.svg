<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="t d">
<title id="t">目標區、進場與風險，要分開計算</title><desc id="d">非真實行情。本站假設已選定八欄、每格兩點、三格轉向，投射距離四十八點。由一百六十與一百五十六分別向下投射，得到一百一十二至一百零八的目標區。另假設空單進場一百四十八、停損一百六十四，風險十六點；較近目標的潛在報酬三十六點，報酬風險二點二五，尚未扣除成本。這不是完整點數圖計數教學、作者歷史案例或勝率。</desc>
<rect width="960" height="760" rx="24" fill="#f5f7fa"/>
<g font-family="system-ui,'Microsoft JhengHei',sans-serif" fill="#20262d">
<text x="40" y="52" font-size="30" font-weight="750">目標區、進場與風險，要分開計算</text>
<text x="40" y="88" font-size="18" fill="#53616e">原創假設：已選定 8 欄 × 每格 2 點 × 3 格轉向 ＝ 投射距離 48 點</text>
<rect x="40" y="116" width="425" height="360" rx="16" fill="#fff" stroke="#d5dde6"/>
<rect x="495" y="116" width="425" height="360" rx="16" fill="#fff" stroke="#d5dde6"/>
<text x="62" y="156" font-size="24" font-weight="750">① 投射：得到價格區間</text>
<text x="517" y="156" font-size="24" font-weight="750">② 交易：另設進場與停損</text>
