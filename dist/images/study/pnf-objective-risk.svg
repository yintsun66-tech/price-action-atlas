<rect x="40" y="501" width="880" height="108" rx="16" fill="#eaf1f7"/>
<text x="62" y="541" font-size="24" font-weight="750">保守算例：36 ÷ 16 ＝ 2.25 倍報酬風險</text>
<text x="62" y="581" font-size="21">不是 2.25 倍收益保證，也不能換算成勝率；尚未扣除成本。</text>
<rect x="40" y="630" width="880" height="66" rx="16" fill="#fff4e2"/>
<text x="62" y="671" font-size="22" font-weight="750">到達目標 ≠ 一定反轉；後續可停止、整理或延續。</text>
<text x="40" y="736" font-size="17" fill="#53616e">非真實行情、完整點數圖算法或績效；位置非等比例，數字另設，不能據此下單。</text>
