<svg xmlns="http://www.w3.org/2000/svg" width="960" height="665" viewBox="0 0 960 665" role="img" aria-labelledby="t d"><title id="t">同一價位的成交：Bid × Ask</title><desc id="d">本站自編數字與分類 · 非市場實測。本站原創合成教學圖；不是即時行情、原作者圖表或績效證據。</desc><rect width="960" height="665" rx="22" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,'Microsoft JhengHei',sans-serif"><text x="40" y="49" fill="#1d1d1f" font-size="28" font-weight="760" text-anchor="start">同一價位的成交：Bid × Ask</text><text x="40" y="85" fill="#586272" font-size="21" font-weight="450" text-anchor="start">本站自編數字與分類 · 非市場實測</text><rect x="40" y="122" width="293.3333333333333" height="72" fill="#f1f6fc"/><text x="56" y="151" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">分類</text><rect x="333.3333333333333" y="122" width="293.3333333333333" height="72" fill="#f1f6fc"/><text x="349.3333333333333" y="151" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">合成數量</text><rect x="626.6666666666666" y="122" width="293.3333333333333" height="72" fill="#f1f6fc"/><text x="642.6666666666666" y="151" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">解讀</text><rect x="40" y="194" width="293.3333333333333" height="86" fill="#fff" stroke="#dce3ed"/><text x="56" y="225" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">Bid 成交量</text><rect x="333.3333333333333" y="194" width="293.3333333333333" height="86" fill="#fff" stroke="#dce3ed"/><text x="349.3333333333333" y="225" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">120</text><rect x="626.6666666666666" y="194" width="293.3333333333333" height="86" fill="#fff" stroke="#dce3ed"/><text x="642.6666666666666" y="225" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">主動賣出分類</text><rect x="40" y="280" width="293.3333333333333" height="86" fill="#f8f9fb" stroke="#dce3ed"/><text x="56" y="311" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">Ask 成交量</text><rect x="333.3333333333333" y="280" width="293.3333333333333" height="86" fill="#f8f9fb" stroke="#dce3ed"/><text x="349.3333333333333" y="311" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">180</text><rect x="626.6666666666666" y="280" width="293.3333333333333" height="86" fill="#f8f9fb" stroke="#dce3ed"/><text x="642.6666666666666" y="311" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">主動買入分類</text><rect x="40" y="366" width="293.3333333333333" height="86" fill="#fff" stroke="#dce3ed"/><text x="56" y="397" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">成交量差</text><rect x="333.3333333333333" y="366" width="293.3333333333333" height="86" fill="#fff" stroke="#dce3ed"/><text x="349.3333333333333" y="397" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">180−120＝＋60</text><rect x="626.6666666666666" y="366" width="293.3333333333333" height="86" fill="#fff" stroke="#dce3ed"/><text x="642.6666666666666" y="397" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">不是新增60口多單</text><rect x="40" y="452" width="293.3333333333333" height="86" fill="#f8f9fb" stroke="#dce3ed"/><text x="56" y="483" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">總分類成交量</text><rect x="333.3333333333333" y="452" width="293.3333333333333" height="86" fill="#f8f9fb" stroke="#dce3ed"/><text x="349.3333333333333" y="483" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">120＋180＝300</text><rect x="626.6666666666666" y="452" width="293.3333333333333" height="86" fill="#f8f9fb" stroke="#dce3ed"/><text x="642.6666666666666" y="483" fill="#1d1d1f" font-size="22" font-weight="450" text-anchor="start">每筆仍有買賣雙方</text><text x="40" y="558" fill="#586272" font-size="21" font-weight="450" text-anchor="start">這只是單一價位，整棒數值須再加總其他價位；單位由資料源決定。</text><path d="M40 617H920" stroke="#dce3ed"/><text x="40" y="645" fill="#586272" font-size="19" font-weight="450" text-anchor="start">原創合成示意 · 非真實行情／交易訊號 · 