<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img" aria-labelledby="t d"><title id="t">訪談故事如何變成一個研究問題</title><desc id="d">本站原創整理 · 每格是一個可核對的問題。本站原創合成教學圖；不是即時行情、原作者圖表或績效證據。</desc><rect width="960" height="530" rx="22" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,'Microsoft JhengHei',sans-serif"><text x="40" y="49" fill="#1d1d1f" font-size="28" font-weight="760" text-anchor="start">訪談故事如何變成一個研究問題</text><text x="40" y="85" fill="#586272" font-size="21" font-weight="450" text-anchor="start">本站原創整理 · 每格是一個可核對的問題</text><rect x="40" y="118" width="420" height="135" rx="16" fill="#f1f6fc" stroke="#dce3ed"/><text x="62" y="155" fill="#1d1d1f" font-size="24" font-weight="730" text-anchor="start">01  記實際來源</text><text x="62" y="196" fill="#586272" font-size="21" font-weight="450" text-anchor="start">只聽簡介就標簡介</text><rect x="500" y="118" width="420" height="135" rx="16" fill="#f4f7f8" stroke="#dce3ed"/><text x="522" y="155" fill="#1d1d1f" font-size="24" font-weight="730" text-anchor="start">02  分開原意</text><text x="522" y="196" fill="#586272" font-size="21" font-weight="450" text-anchor="start">不把猜測當作者原話</text><rect x="40" y="278" width="420" height="135" rx="16" fill="#f1f6fc" stroke="#dce3ed"/><text x="62" y="315" fill="#1d1d1f" font-size="24" font-weight="730" text-anchor="start">03  提出可測條件</text><text x="62" y="356" fill="#586272" font-size="21" font-weight="450" text-anchor="start">保留資料與失效定義</text><rect x="500" y="278" width="420" height="135" rx="16" fill="#f4f7f8" stroke="#dce3ed"/><text x="522" y="315" fill="#1d1d1f" font-size="24" font-weight="730" text-anchor="start">04  只選一個下一步</text><text x="522" y="356" fill="#586272" font-size="21" font-weight="450" text-anchor="start">使用新資料回答問題</text><text x="40" y="454" fill="#586272" font-size="21" font-weight="450" text-anchor="start">每次更新都保存當時資料，不以後來結果回填原判斷。</text><path d="M40 482H920" stroke="#dce3ed"/><text x="40" y="510" fill="#586272" font-size="19" font-weight="450" text-anchor="start">原創合成示意 · 非真實行情／交易訊號 · 價格、量與事件均須另行驗證</text></g></svg>